name: Daily HA Tender Update

on:
  workflow_dispatch:
  schedule:
    # 00:17 UTC = 08:17 Hong Kong
    - cron: "17 0 * * *"

concurrency:
  group: ha-tender-daily
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history is needed so the bot can safely rebase
          # if main changes while the scraper is running.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch HA and update unique database
        run: python scripts/update_ha.py

      - name: Commit refreshed data
        shell: bash
        run: |
          set -e

          git config user.name "ha-tender-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No database changes to commit."
            exit 0
          fi

          git commit -m "chore: daily HA tender update"

          # main may have changed while this Action was running
          # (for example, a manual index.html update).
          # Rebase the bot commit onto the newest remote main before pushing.
          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"

            git fetch origin main

            if ! git rebase origin/main; then
              echo "Rebase conflict detected. Refusing to overwrite remote history."
              git rebase --abort || true
              exit 1
            fi

            if git push origin HEAD:main; then
              echo "Database update pushed successfully."
              exit 0
            fi

            echo "Remote changed again before push; retrying..."
            sleep 3
          done

          echo "Could not push after 3 attempts."
          exit 1

      - name: Build static Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/*.json _site/data/
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
